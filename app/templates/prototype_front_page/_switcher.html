{# PROTOTYPE switcher bar: not part of any design. Keyboard arrows skipped (would need custom JS). #}
<nav class="proto-switcher" aria-label="Prototype variant switcher">
  <a href="/?variant={{ prev }}" aria-label="Previous variant">&larr;</a>
  <span>{{ variant | upper }}: {{ variant_name }}</span>
  <a href="/?variant={{ next }}" aria-label="Next variant">&rarr;</a>
</nav>
<style>
  .proto-switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 999px;
    background: #111; color: #fff; font: 600 13px/1.2 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); white-space: nowrap; }
  .proto-switcher a { color: #fff; text-decoration: none; font-size: 18px; padding: 0 4px; }
</style>
